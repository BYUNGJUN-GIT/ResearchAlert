# Research Alert 관심 분야 설정
# 영문 표현을 사용하세요. 모든 비교는 대소문자를 구분하지 않습니다.
keywords:
  # 제목 또는 초록에 하나라도 있으면 열수송 연구 후보가 됩니다.
  include_any:
    - "time-domain thermoreflectance"
    - "TDTR"
    - "frequency-domain thermoreflectance"
    - "FDTR"
    - "transient thermoreflectance"
    - "pump-probe thermoreflectance"
    - "thermal conductivity"
    - "lattice thermal conductivity"
    - "electronic thermal conductivity"
    - "thermal boundary conductance"
    - "interfacial thermal conductance"
    - "thermal interface conductance"
    - "thermal boundary resistance"
    - "Kapitza conductance"
    - "Kapitza resistance"
    - "phonon thermal transport"
    - "phonon transport"
    - "magnon thermal transport"
    - "heat carrier"
    - "thermal diffusivity"
    - "thermal effusivity"
    - "thermal interface material"
    - "thermal management"
    - "heat dissipation"
    - "semiconductor cooling"
    - "semiconductor thermal management"
    - "electronics cooling"
    - "thermal packaging"
    - "wide-bandgap semiconductor"
    - "GaN thermal"
    - "SiC thermal"
  include_all: []

  # 의학·생물학 논문의 열전달, 비관련 학문 분야, 문헌 종설을 최대한 걸러 냅니다.
  exclude:
    - "clinical trial"
    - "patient"
    - "cancer"
    - "tumor"
    - "drug delivery"
    - "protein"
    - "cell culture"
    - "genome"
    - "genomic"
    - "biomedical"
    - "biological tissue"
    - "agriculture"
    - "economics"
    - "economic"
    - "finance"
    - "philosophy"
    - "humanities"
    - "literature review"
    - "systematic review"
    - "meta-analysis"
    - "protocol"

# 국가나 출판사만으로 배제하지 않고, 검토가 필요한 저널명을 명시합니다.
excluded_journals:
  - "eScience"

# 출판사 메타데이터가 일치하면 논문을 제외합니다.
excluded_publishers:
  - "MDPI"

journals:
  # Nature 자매지는 journal 이름이 아니라 출판사 메타데이터로 포괄합니다.
  tier_1_publishers:
    - "Nature Portfolio"
  tier_1:
    - "Nature"
    - "Nature Communications"
    - "Science"
    - "Science Advances"
    - "Advanced Materials"
    - "Physical Review Letters"

  # Journal list.csv: Q1, JCI >= 2.00, eScience 제외.
  # Nature Portfolio 저널은 위 tier_1 출판사 규칙으로 먼저 처리합니다.
  tier_2:
    - "Physical Review Materials"
    - "Physical Review B"
    - "Nano-Micro Letters"
    - "Advanced Powder Materials"
    - "Advanced Fiber Materials"
    - "Joule"
    - "EnergyChem"
    - "Advanced Energy Materials"
    - "Materials Today"
    - "International Journal of Plasticity"
    - "Journal of Materials Science & Technology"
    - "Energy Storage Materials"
    - "International Journal of Extreme Manufacturing"
    - "Nano Materials Science"
    - "Carbon Energy"
    - "Advanced Functional Materials"
    - "InfoMat"
    - "Journal of Magnesium and Alloys"
    - "Progress in Materials Science"
    - "Interdisciplinary Materials"
    - "Nano Energy"
    - "SusMat"
    - "ACS Energy Letters"
    - "Exploration"
    - "Advanced Industrial and Engineering Polymer Research"
    - "ACS Nano"
    - "Accounts of Materials Research"
    - "Cement and Concrete Research"
    - "Matter"
    - "Carbon Neutralization"

  # Journal list.csv: Q1, 1.00 <= JCI < 2.00
  tier_3:
    - "Additive Manufacturing"
    - "Acta Materialia"
    - "Carbon"
    - "Rare Metals"
    - "Corrosion Science"
    - "Materials Today Physics"
    - "Advanced Science"
