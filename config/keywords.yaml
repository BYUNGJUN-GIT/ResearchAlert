# Research Alert 관심 분야 설정
# 영문 표현을 사용하세요. 모든 비교는 대소문자를 구분하지 않습니다.
keywords:
  # 제목 또는 초록에 하나라도 있으면 열수송 연구 후보가 됩니다.
  include_any:
    - "time-domain thermoreflectance"
    - "TDTR"
    - "frequency-domain thermoreflectance"
    - "FDTR"
    - "transient thermoreflectance"
    - "pump-probe thermoreflectance"
    - "thermal conductivity"
    - "lattice thermal conductivity"
    - "electronic thermal conductivity"
    - "thermal boundary conductance"
    - "interfacial thermal conductance"
    - "thermal interface conductance"
    - "thermal boundary resistance"
    - "Kapitza conductance"
    - "Kapitza resistance"
    - "phonon thermal transport"
    - "phonon transport"
    - "magnon thermal transport"
    - "heat carrier"
    - "thermal diffusivity"
    - "thermal effusivity"
    - "thermal interface material"
    - "thermal management"
    - "heat dissipation"
    - "semiconductor cooling"
    - "semiconductor thermal management"
    - "electronics cooling"
    - "thermal packaging"
    - "spin dynamics"
    - "spin-orbit torque"
    - "spin current"
    - "spin hall effect"
    - "ballistic transport"
    - "MOKE"
  include_all: []

  # 의학·생물학 논문의 열전달, 비관련 학문 분야, 문헌 종설을 최대한 걸러 냅니다.
  exclude:
    - "clinical trial"
    - "patient"
    - "cancer"
    - "tumor"
    - "drug delivery"
    - "protein"
    - "cell culture"
    - "genome"
    - "genomic"
    - "biomedical"
    - "biological tissue"
    - "agriculture"
    - "economics"
    - "economic"
    - "finance"
    - "philosophy"
    - "humanities"
    - "review"
    - "literature review"
    - "systematic review"
    - "meta-analysis"
    - "protocol"

# 국가나 출판사만으로 배제하지 않고, 검토가 필요한 저널명을 명시합니다.
excluded_journals:
  - "eScience"

# 출판사 메타데이터가 일치하면 논문을 제외합니다.
excluded_publishers:
  - "MDPI"

# true로 바꾸면 Tier에 없는 저널도 낮은 점수로 후보에 포함합니다.
# 연구 알림의 신뢰도를 위해 기본값은 false입니다.
journal_policy:
  allow_unlisted_journals: false

journals:
  # 저널명을 명시적으로 지정한 경우에만 해당 Tier를 적용합니다.
  tier_1:
    - "Nature"
    - "Science"
    # 출판사 메타데이터 누락에도 확실히 Tier 1로 처리할 주요 Nature 자매지
    - "Nature Materials"
    - "Nature Physics"
    - "Nature Chemistry"
    - "Nature Nanotechnology"
    - "Nature Energy"
    - "Nature Electronics"
    - "Nature Photonics"
    - "Nature Methods"
    - "Nature Reviews Materials"
    - "Nature Chemical Engineering"
    - "Nature Computational Science"

  # 최상위 범용 재료·물리 저널
  tier_2:
    - "Nature Communications"
    - "Science Advances"
    - "Advanced Materials"
    - "Physical Review Letters"
    - "ACS Nano"

  # 기존 Tier 2: Journal list.csv Q1, JCI >= 2.00
  tier_3:
    - "Physical Review B"
    - "Communications Materials"
    - "Communications Physics"
    - "Communications Chemistry"
    - "Acta Materialia"
    - "Advanced Science"
    - "Nano-Micro Letters"
    - "Advanced Powder Materials"
    - "Advanced Fiber Materials"
    - "Joule"
    - "EnergyChem"
    - "Advanced Energy Materials"
    - "Materials Today"
    - "International Journal of Plasticity"
    - "Journal of Materials Science & Technology"
    - "Energy Storage Materials"
    - "Advanced Functional Materials"
    - "InfoMat"
    - "Journal of Magnesium and Alloys"
    - "Progress in Materials Science"
    - "Nano Energy"
    - "SusMat"
    - "ACS Energy Letters"
    - "Cement and Concrete Research"
    - "Matter"

  # 기존 Tier 3: Journal list.csv Q1, 1.00 <= JCI < 2.00
  tier_4:
    - "Additive Manufacturing"
    - "Physical Review Materials"
    - "Carbon"
    - "Rare Metals"
    - "Corrosion Science"
    - "Materials Today Physics"
    - "Energy & Environmental Materials"
    - "Materials Science & Engineering R-Reports"
    - "Virtual and Physical Prototyping"
    - "Responsive Materials"
    - "Small"
    - "Materials Horizons"
    - "Wearable Electronics"
    - "Electron"
    - "EcoMat"
    - "Materials Research Letters"
    - "Advanced Optical Materials"
    - "Nano Research"
    - "Nano Letters"
    - "Nano Today"
    - "Materials Today Sustainability"
    - "Materials Today Advances"
    - "ACS Materials Letters"
    - "Materials & Design"
    - "Journal of Materials Research and Technology"
    - "Materials Today Energy"
    - "Materials Science and Engineering A"
    - "Journal of Materials Chemistry A"
    - "Materials Today Catalysis"
    - "Nano Convergence"
    - "Industrial Chemistry & Materials"
    - "ACS Applied Materials & Interfaces"
    - "Supramolecular Materials"
    - "Materials Today Chemistry"
    - "Small Structures"
    - "Materials Today Nano"
    - "Chemistry of Materials"

# OpenAlex 색인 전의 최신 Nature 논문도 놓치지 않도록 공식 RSS를 병행합니다.
# 필요한 Nature 자매지는 같은 형식으로 계속 추가할 수 있습니다.
rss_feeds:
  - journal: "Nature"
    url: "https://feeds.nature.com/nature/rss/current"
  - journal: "Nature Materials"
    url: "https://feeds.nature.com/nmat/rss/current"
  - journal: "Nature Physics"
    url: "https://feeds.nature.com/nphys/rss/current"
  - journal: "Nature Chemistry"
    url: "https://feeds.nature.com/nchem/rss/current"
  - journal: "Nature Nanotechnology"
    url: "https://feeds.nature.com/nnano/rss/current"
  - journal: "Nature Energy"
    url: "https://feeds.nature.com/nenergy/rss/current"
  - journal: "Nature Electronics"
    url: "https://feeds.nature.com/natelectron/rss/current"
  - journal: "Nature Photonics"
    url: "https://feeds.nature.com/nphoton/rss/current"
  - journal: "Nature Methods"
    url: "https://feeds.nature.com/nmeth/rss/current"
  - journal: "Nature Communications"
    url: "https://feeds.nature.com/ncomms/rss/current"

delivery:
  max_papers: 10
  language: "ko"

# 매일 실행 시 최근 일주일 논문을 탐색합니다. 이미 발송한 DOI는 별도 이력에서 제외됩니다.
collection:
  lookback_hours: 168
