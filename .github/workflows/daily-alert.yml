name: Daily Research Alert

on:
  workflow_dispatch:
  schedule:
    # 일요일 22:30 UTC = 월요일 07:30 KST
    - cron: "30 22 * * 0"

permissions:
  contents: write

concurrency:
  group: daily-research-alert
  cancel-in-progress: false

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and send alert
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/daily_alert.py

      - name: Persist sent-paper history
        run: |
          if git diff --quiet -- data/sent_dois.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_dois.json
          git commit -m "Update sent paper history"
          git push
